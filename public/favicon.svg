<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favRobux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b0f17" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Stylized Roblox Tilted Hexagon Coin in Emerald -->
  <g transform="translate(32, 32) rotate(15) translate(-32, -32)" filter="url(#glow)">
    <polygon points="32,8 52,19.5 52,44.5 32,56 12,44.5 12,19.5" fill="url(#favRobux)" stroke="#6ee7b7" stroke-width="2" stroke-linejoin="round" />
    <!-- Center Square Cutout -->
    <rect x="25" y="25" width="14" height="14" rx="2" fill="#0b0f17" stroke="#34d399" stroke-width="1.5" />
  </g>
</svg>
